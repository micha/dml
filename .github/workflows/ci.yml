name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-core:
    name: C core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QUINT_PACKAGE: '@informalsystems/quint@0.33.1'
      DML_QUINT_SCRIPT: build/quint-tool/node_modules/@informalsystems/quint/dist/src/cli.js
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python for Meson
        if: runner.os != 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Meson and Ninja
        if: runner.os != 'Windows'
        run: python -m pip install 'meson>=1.4' ninja

      - name: Set up Node.js
        if: runner.os != 'Windows'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up MSYS2 UCRT64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nodejs
            mingw-w64-ucrt-x86_64-python

      - name: Run Quint checks (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          npm install --prefix build/quint-tool --no-save --ignore-scripts --no-audit --no-fund "$QUINT_PACKAGE"
          ./scripts/check.sh --quint

      - name: Run Quint checks (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -e
          npm install --prefix build/quint-tool --no-save --ignore-scripts --no-audit --no-fund "$QUINT_PACKAGE"
          ./scripts/check.sh --quint

      - name: Upload Meson logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-meson-logs
          path: build/core-check-quint/meson-logs
          if-no-files-found: warn
