name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-core:
    name: C core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2022]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python for Meson
        if: runner.os != 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Meson and Ninja
        if: runner.os != 'Windows'
        run: python -m pip install 'meson>=1.4' ninja

      - name: Set up MSYS2 UCRT64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja

      - name: Build C core (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/check.sh

      - name: Build C core (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: scripts/check.sh

      - name: Upload Meson logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-meson-logs
          path: build/core-check/meson-logs
          if-no-files-found: warn
