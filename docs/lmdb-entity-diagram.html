<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DML · LMDB entity map</title>
<style>
  :root { color-scheme: dark; --bg: #10151f; --panel: #192230; --text: #e7edf7; --muted: #aab9cf; --accent: #7bdcc7; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, sans-serif; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; }
  .diagram { position: relative; min-width: 0; }
  select { background: var(--panel); color: var(--text); border: 1px solid #4c607a; border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer; }
  select:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  #canvas { width: 100%; height: calc(100vh - 72px); min-height: 480px; display: block; background: #121a26; touch-action: none; cursor: grab; }
  #canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #canvas.dragging { cursor: grabbing; }
  aside { border-left: 1px solid #334256; padding: 24px; overflow-wrap: anywhere; max-height: 100vh; overflow-y: auto; }
  aside h2 { margin: 0 0 8px; font-size: 23px; }
  aside h3 { margin: 22px 0 6px; font-size: 14px; color: var(--accent); }
  aside p { margin: 8px 0; }
  aside ul { padding-left: 20px; }
  aside li { margin: 8px 0; }
  aside code { font-size: 12px; color: #b4d4ff; }
  a { color: #9bbfff; }
  .note { color: var(--muted); font-size: 13px; }
  .key { background: #101722; padding: 12px; border-radius: 6px; }
  .memory-layout { margin: 12px 0; }
  .memory-row { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px; margin: 3px 0; }
  .offset { font: 12px/1.4 ui-monospace, monospace; color: var(--muted); padding-top: 10px; }
  .memory-field { position: relative; border: 1px solid var(--field-color); border-left-width: 4px; border-radius: 4px; padding: 8px 10px; background: #182331; font-size: 13px; }
  .memory-field .width { float: right; margin-left: 8px; color: var(--muted); font: 11px/1.8 ui-monospace, monospace; }
  .memory-field .value { display: block; font: 11px/1.5 ui-monospace, monospace; color: var(--muted); }
  .memory-field a { color: var(--field-color); font-weight: 600; }
  .field-envelope { --field-color: #baa6ed; }
  .field-size { --field-color: #8dbbff; }
  .field-kind { --field-color: #efc27e; }
  .field-reference { --field-color: #7bdcc7; }
  .field-name { --field-color: #eea6c4; }
  .field-data { --field-color: #b9c5d5; }
  .masked { background-image: repeating-linear-gradient(45deg, transparent 0 6px, #bac8dd20 6px 8px), repeating-linear-gradient(-45deg, transparent 0 6px, #bac8dd20 6px 8px); }
  .memory-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11px; margin: 12px 0; }
  .memory-legend span { border-left: 4px solid var(--field-color); padding-left: 5px; }
  .repeat { border-left: 2px dashed #536985; padding-left: 8px; }
  .layout-caption { color: var(--muted); font-size: 11px; }
  .variant-picker { width: 100%; margin: 8px 0; }
  .entity { cursor: pointer; }
  .entity .card { fill: #1b293c; stroke: #536985; stroke-width: 1.5; }
  .entity .stripe { fill: #81aef0; }
  .entity.mutable .stripe { fill: #f1c27b; }
  .entity.meta .stripe { fill: #b6a2e9; }
  .entity:hover .card, .entity:focus .card, .entity.selected .card { stroke: var(--accent); stroke-width: 3; }
  .entity:focus { outline: none; }
  .entity text { fill: var(--text); font-family: system-ui, sans-serif; pointer-events: none; }
  .entity .title { font-size: 22px; font-weight: 650; }
  .entity .subtitle { font-size: 12px; fill: #b4c6df; }
  .entity .field { font: 14px ui-monospace, monospace; }
  .entity .foot { font-size: 12px; fill: #aab9cf; }
  .edge { fill: none; stroke: #8aabc7; stroke-width: 2; marker-end: url(#arrow); }
  .edge.conditional { stroke-dasharray: 7 5; }
  .edge-label { fill: #d0e1f4; font: 13px system-ui, sans-serif; paint-order: stroke; stroke: #121a26; stroke-width: 6px; stroke-linejoin: round; }
  .faded { opacity: .17; }
  .edge.active { stroke: var(--accent); stroke-width: 3; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; padding: 12px 20px; color: var(--muted); font-size: 12px; }
  @media (max-width: 850px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid #334256; max-height: none; } #canvas { height: 65vh; } }
  @media print { main { display: block; } #canvas { height: 900px; } aside { border: 0; max-height: none; overflow: visible; } }
</style>
</head>
<body>
<main>
  <section class="diagram" aria-label="Interactive entity diagram">
    <svg id="canvas" viewBox="0 0 1200 1160" tabindex="0" role="img" aria-labelledby="svg-title svg-description">
      <title id="svg-title">DML persisted entity relationships</title>
      <desc id="svg-description">Refs target commits. Commits reference trees and parent commits. Trees embed named DAG entries. DAGs reference root and binding nodes. Literal nodes reference datums; sub-DAG nodes reference DAGs. Composite datums reference other datums. Schema metadata has no object references. Arrow labels count targets per source; referenced targets may be shared. A diamond marks fields hashed into the immutable entity's content ID; a dash marks ref or metadata fields with no content-addressed ID.</desc>
      <defs>
        <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#253348"/></pattern>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8aabc7"/></marker>
      </defs>
      <rect width="1200" height="1160" fill="url(#grid)"/>
      <g id="edges">
        <g data-from="ref" data-to="commit"><path class="edge" d="M 340 210 H 420"/><text class="edge-label" x="350" y="197">1 target</text></g>
        <g data-from="commit" data-to="tree"><path class="edge" d="M 700 210 H 800"/><text class="edge-label" x="723" y="197">1 tree</text></g>
        <g data-from="commit" data-to="commit"><path class="edge" d="M 620 130 V 60 H 500 V 130"/><text class="edge-label" x="560" y="43" text-anchor="middle">0..* ordered parents</text></g>
        <g data-from="tree" data-to="dag"><path class="edge" d="M 940 330 V 460"/><text class="edge-label" x="956" y="391">entries[].dag · 0..*</text></g>
        <g data-from="dag" data-to="node"><path class="edge" d="M 800 530 H 700"/><text class="edge-label" x="750" y="515" text-anchor="middle">1 root</text><path class="edge" d="M 800 590 H 700"/><text class="edge-label" x="750" y="616" text-anchor="middle">0..* bindings</text></g>
        <g data-from="node" data-to="dag"><path class="edge conditional" d="M 620 660 V 730 H 940 V 660"/><text class="edge-label" x="780" y="754" text-anchor="middle">1 DAG target if SUBDAG</text></g>
        <g data-from="node" data-to="datum"><path class="edge conditional" d="M 540 660 V 840"/><text class="edge-label" x="525" y="786" text-anchor="end">1 datum target if LITERAL</text></g>
        <g data-from="datum" data-to="datum"><path class="edge conditional" d="M 700 890 H 815 V 1000 H 700"/><text class="edge-label" x="839" y="934">0..* datum IDs</text><text class="edge-label" x="839" y="958">LIST / SET / MAP</text></g>
      </g>
      <g id="entities"></g>
      <text x="60" y="1105" class="edge-label">Arrows = stored ID references, not execution dependencies. Counts = targets per source.</text>
      <text x="60" y="1130" class="edge-label">All targets may be shared. Embedded entries/bindings are not separate LMDB entities.</text>
    </svg>
    <div class="legend"><span>■ Blue: immutable packed object</span><span>■ Amber: mutable raw ref</span><span>■ Purple: schema metadata</span><span>◆ Field hashed into content ID</span><span>— No content-addressed ID</span><span>Dashed arrow: kind-dependent reference</span></div>
  </section>
  <aside id="details" aria-live="polite" aria-label="Entity details"></aside>
</main>
<noscript><p>Enable JavaScript to render the entity cards and use the interactive diagram.</p></noscript>
<script>
'use strict';
// Informative projection of src/repo.c, src/object.c and docs/spec-next/{repository,objects,records}.md.
// Entries/bindings/parents are packed fields, not secondary databases or indexes.
const entities = [
  { id: 'ref', hashedFields: false, title: 'Ref / head', category: 'mutable', x: 60, y: 130,
    key: 'refs/heads/<name>', size: '16 raw bytes · no envelope',
    fields: ['name : ASCII key suffix', 'target : Commit ID'],
    summary: 'A mutable, case-sensitive name pointing to an immutable history commit.',
    rules: ['Create requires an absent ref; update requires an existing ref.', 'Target commit and its direct references are validated. Moving a ref does not rewrite any historical object.', 'No fast-forward, ancestry, or compare-and-swap policy is imposed.'],
    links: ['Exactly one target commit per ref; any commit can have zero or many refs.'], source: 'repository.md#refs' },
  { id: 'commit', hashedFields: true, title: 'Commit', x: 420, y: 130, key: 'objects/commits/<id>', size: '40 + 16 × parent count bytes',
    fields: ['tree : Tree ID', 'parents[] : Commit IDs', 'parent_count : u32'],
    summary: 'An immutable snapshot reference plus ordered history links. A history commit is not an LMDB transaction.',
    rules: ['Zero parents is valid for an initial commit. Multiple parents are allowed; duplicate IDs are rejected.', 'Parent order contributes to content identity. Recording multiple parents is not itself a merge operation.'],
    links: ['Exactly one tree.', 'Zero or more ordered parent commits. Trees and parents may be shared across commits.'], source: 'objects.md#packed-bodies' },
  { id: 'tree', hashedFields: true, title: 'Tree', x: 800, y: 130, key: 'objects/trees/<id>', size: '24 bytes + embedded entries',
    fields: ['entry_count : u32', 'entries[] : {name, DAG ID}'],
    summary: 'A named collection of DAGs, encoded inside a single immutable tree record.',
    rules: ['Entries are sorted by name bytes; duplicate names are rejected.', 'Empty trees are valid. Entry names are not filesystem paths or DAG-local node bindings.'],
    links: ['Zero or more entry DAG IDs. The same DAG can be used under multiple names or by multiple trees.'], source: 'objects.md#names-and-canonical-ordering' },
  { id: 'schema', hashedFields: false, title: 'Schema metadata', category: 'meta', x: 60, y: 460, key: 'meta/schema', size: '24 bytes · packed metadata',
    fields: ['schema_version : u32 = 1'],
    summary: 'The singleton record used to initialize and validate the repository schema.',
    rules: ['Uses the 20-byte record envelope plus a 4-byte schema version.', 'Not content-addressed. Unsupported or malformed schema is rejected when opening a repository.'],
    links: ['No object references. One schema record per initialized repository.'], source: 'repository.md#repository-contents-and-initialization' },
  { id: 'node', hashedFields: true, title: 'Node', x: 420, y: 460, key: 'objects/nodes/<id>', size: '40 bytes · packed object',
    fields: ['kind : LITERAL | SUBDAG', 'target : Datum ID | DAG ID'],
    summary: 'A tagged reference to a value or a nested DAG. The two target relationships are mutually exclusive.',
    rules: ['LITERAL (kind 1) references a datum. SUBDAG (kind 2) references a DAG.', 'Node kind and target contribute to identity. Nesting records structure; it does not execute a DAG.', 'Only these two node kinds are implemented in this storage model.'],
    links: ['Exactly one datum OR exactly one DAG, depending on kind.', 'Nodes may be shared by roots and named bindings in multiple DAGs.'], source: 'objects.md#typed-object-structure' },
  { id: 'dag', hashedFields: true, title: 'DAG', x: 800, y: 460, key: 'objects/dags/<id>', size: '40 bytes + embedded bindings',
    fields: ['root : Node ID', 'binding_count : u32', 'bindings[] : {name, Node ID}'],
    summary: 'One root node and optional local names bound to immutable node IDs.',
    rules: ['A root is mandatory; an empty binding set is valid.', 'Bindings are sorted by unique name. Different names may target the same node, including the root.', 'There is no separate node-membership array, global name scope, or implicit nested lookup.'],
    links: ['Exactly one root node and zero or more binding node IDs.', 'Sub-DAG nodes can target this DAG; trees can name it.'], source: 'objects.md#typed-object-structure' },
  { id: 'datum', hashedFields: true, title: 'Datum', x: 420, y: 840, key: 'objects/datums/<id>', size: '40 bytes + payload',
    fields: ['kind : one of 10 kinds', 'payload_len / offset : u64', 'payload : scalar | IDs'],
    summary: 'An immutable value. Composite payloads contain datum IDs rather than nested records.',
    rules: ['Kinds: NULL, BOOL, I64, F64, BYTES, STRING, URI, LIST, SET, MAP.', 'LIST preserves order and allows duplicates. SET contains sorted unique IDs. MAP contains pairs sorted by unique key IDs.', 'MAP keys may be any datum kind. Both map keys and values reference datums, never nodes or other object types.', 'STRING is NFC UTF-8; URI and F64 have canonicalization rules.'],
    links: ['Scalars have no object references.', 'LIST/SET have zero or more datum references. Each MAP entry has one key datum and one value datum.'], source: 'records.md#datum-model' }
];
// Full-record storage identity: all immutable body bytes are hashed, including
// counts, name lengths, names, ordered arrays and raw referenced IDs. Not a reuse key.
const identityEnvelope = [
  { offset: 0, width: 4, label: 'magic', color: 'envelope', value: 'u32 · 0x314c4d44', hashed: false },
  { offset: 4, width: 2, label: 'format version', color: 'envelope', value: 'u16 · 1', hashed: true },
  { offset: 6, width: 2, label: 'record type', color: 'kind', value: 'u16', hashed: true },
  { offset: 8, width: 4, label: 'total record length', color: 'size', value: 'u32 · complete record size', hashed: false },
  { offset: 12, width: 4, label: 'reserved flags', color: 'envelope', value: 'u32 · 0', hashed: true },
  { offset: 16, width: 4, label: 'checksum', color: 'envelope', value: 'u32 · 0', hashed: false }
];
const svg = document.getElementById('canvas');
const cards = document.getElementById('entities');
const details = document.getElementById('details');
const ns = 'http://www.w3.org/2000/svg';
function svgElement(tag, attributes, text) {
  const element = document.createElementNS(ns, tag);
  for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
  if (text !== undefined) element.textContent = text;
  return element;
}
for (const entity of entities) {
  const group = svgElement('g', { id: `entity-${entity.id}`, class: `entity ${entity.category || ''}`, transform: `translate(${entity.x} ${entity.y})`,
    tabindex: '0', role: 'button', 'aria-label': `Inspect ${entity.title}`, 'aria-pressed': 'false', 'data-id': entity.id });
  group.append(svgElement('rect', { class: 'card', width: 280, height: 200, rx: 12 }));
  group.append(svgElement('rect', { class: 'stripe', x: 16, y: 20, width: 4, height: 26, rx: 2 }));
  group.append(svgElement('text', { class: 'title', x: 30, y: 41 }, entity.title));
  group.append(svgElement('text', { class: 'subtitle', x: 18, y: 67 }, entity.key));
  group.append(svgElement('line', { x1: 18, y1: 82, x2: 262, y2: 82, stroke: '#3a506a' }));
  entity.fields.forEach((field, index) => group.append(svgElement('text', { class: 'field', x: 18, y: 107 + index * 24 }, `${entity.hashedFields ? '◆' : '—'} ${field}`)));
  group.append(svgElement('text', { class: 'foot', x: 18, y: 181 }, entity.size));
  group.addEventListener('click', () => { if (!suppressClick) select(entity.id); });
  group.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); select(entity.id); }
  });
  cards.append(group);
}
function paragraph(text, className = '') {
  const element = document.createElement('p'); element.textContent = text; element.className = className; return element;
}
function heading(text, tag = 'h3') {
  const element = document.createElement(tag); element.textContent = text; return element;
}
function list(items) {
  const element = document.createElement('ul');
  for (const text of items) { const item = document.createElement('li'); item.textContent = text; element.append(item); }
  return element;
}
// Offsets describe packed LMDB values, not native C structs. Symbolic offsets
// are relative to the start of each repeated entry; rows are not drawn to scale.
function layoutField(offset, width, label, color, value = '', targets = []) {
  return { offset, width, label, color, value, targets };
}
const bodyLayouts = {
  ref: [layoutField(0, 16, 'target commit ID', 'reference', 'raw ID', ['commit'])],
  schema: [layoutField(20, 4, 'schema version', 'kind', 'u32 · 1')],
  node: [layoutField(20, 4, 'node kind', 'kind', 'u32 · 1 = LITERAL, 2 = SUBDAG'),
    layoutField(24, 16, 'target ID', 'reference', 'LITERAL → Datum / SUBDAG → DAG', ['datum', 'dag'])],
  dag: [layoutField(20, 16, 'root node ID', 'reference', 'raw ID', ['node']),
    layoutField(36, 4, 'binding count', 'size', 'u32 · n')],
  tree: [layoutField(20, 4, 'entry count', 'size', 'u32 · n')],
  commit: [layoutField(20, 16, 'tree ID', 'reference', 'raw ID', ['tree']),
    layoutField(36, 4, 'parent count', 'size', 'u32 · n')],
  datum: [layoutField(20, 4, 'datum kind', 'kind', 'u32 · 1…10'),
    layoutField(24, 8, 'payload length', 'size', 'u64 · bytes after offset 40'),
    layoutField(32, 8, 'payload offset', 'size', 'u64 · 40')]
};
const datumKinds = [
  ['NULL', 0, 'empty'], ['BOOL', 1, '0 or 1'], ['I64', 8, 'signed integer'],
  ['F64', 8, 'canonical IEEE-754 binary64'], ['BYTES', 'L', 'uninterpreted bytes'],
  ['STRING', 'L', 'NFC UTF-8'], ['URI', 'L', 'canonical absolute URI'],
  ['LIST', null, 'ordered; duplicates allowed'], ['SET', null, 'sorted unique IDs'],
  ['MAP', null, 'pairs sorted by unique key IDs']
];
function memoryRows(fields, hashed = false) {
  const diagram = document.createElement('div'); diagram.className = 'memory-layout';
  for (const field of fields) {
    const row = document.createElement('div'); row.className = 'memory-row';
    const offset = document.createElement('div'); offset.className = 'offset';
    offset.textContent = `+${field.offset}`;
    const masked = hashed && field.hashed === false;
    const block = document.createElement('div');
    block.className = `memory-field field-${field.color}${masked ? ' masked' : ''}`;
    block.setAttribute('data-offset', field.offset);
    block.setAttribute('data-width', field.width);
    block.setAttribute('data-masked', String(masked));
    const width = document.createElement('span'); width.className = 'width'; width.textContent = `${field.width} B`;
    block.append(width);
    const label = document.createElement('span'); label.textContent = field.label; block.append(label);
    for (const target of field.targets || []) {
      const link = document.createElement('a'); link.href = `#entity-${target}`;
      link.textContent = ` → ${entities.find(item => item.id === target).title}`;
      link.setAttribute('data-target', target);
      link.addEventListener('click', event => { event.preventDefault(); select(target); });
      block.append(link);
    }
    const value = document.createElement('span'); value.className = 'value';
    value.textContent = `${field.value}${masked ? ' · masked → 0 before hashing' : ''}`;
    block.append(value); row.append(offset, block); diagram.append(row);
  }
  return diagram;
}
function repeatedLayout(title, fields) {
  const group = document.createElement('div'); group.className = 'repeat';
  group.append(heading(title), memoryRows(fields)); return group;
}
function datumPayload(kindIndex) {
  const [kind, width, description] = datumKinds[kindIndex];
  const container = document.createElement('div');
  container.append(heading(`${kind} payload · kind ${kindIndex + 1}`));
  if (width !== null) {
    container.append(memoryRows([layoutField(40, width, 'payload', 'data', description)]));
    return container;
  }
  container.append(memoryRows([layoutField(40, 4, 'item count', 'size', 'u32 · n')]));
  const fields = kind === 'MAP'
    ? [layoutField('44 + 32i', 16, 'key datum ID', 'reference', 'raw ID', ['datum']),
      layoutField('60 + 32i', 16, 'value datum ID', 'reference', 'raw ID', ['datum'])]
    : [layoutField('44 + 16i', 16, 'element datum ID', 'reference', 'raw ID', ['datum'])];
  container.append(repeatedLayout(`Repeat n times · i = 0…n−1 · ${description}`, fields));
  return container;
}
function renderEntityLayout(entity) {
  details.append(heading(entity.title, 'h2'));
  const key = document.createElement('code'); key.textContent = entity.key;
  const keyBox = document.createElement('div'); keyBox.className = 'key'; keyBox.append(key);
  details.append(heading('LMDB key · outside value / hash input'), keyBox,
    heading(`Packed value · ${entity.size}`),
    paragraph('Byte offsets from value start · little-endian integers · no padding · schematic rows, not to scale', 'layout-caption'));
  const legend = document.createElement('div'); legend.className = 'memory-legend';
  for (const [color, text] of [['envelope', 'Envelope'], ['size', 'Lengths / counts'], ['kind', 'Type / kind'],
    ['reference', 'Referenced IDs'], ['name', 'Names'], ['data', 'Value bytes']]) {
    const swatch = document.createElement('span'); swatch.className = `field-${color}`; swatch.textContent = text; legend.append(swatch);
  }
  details.append(legend);
  details.append(paragraph(entity.hashedFields
    ? 'Cross-hatched = zeroed before hashing; all other value bytes are included in XXH3-128. Fields are zeroed, not removed.'
    : 'No content ID computed for this value; no fields are hash-masked.', 'layout-caption'));
  if (entity.id !== 'ref') {
    const type = { schema: 1, datum: 2, node: 3, dag: 4, tree: 5, commit: 6 }[entity.id];
    const envelope = identityEnvelope.map(field => ({ ...field, value: field.offset === 6 ? `u16 · ${type}` : field.value }));
    details.append(heading('Envelope · bytes 0–19'), memoryRows(envelope, entity.hashedFields));
  }
  const body = memoryRows(bodyLayouts[entity.id]);
  details.append(heading(entity.id === 'ref' ? 'Raw value · no envelope' : 'Body'), body);
  if (entity.id === 'dag' || entity.id === 'tree') {
    const dag = entity.id === 'dag';
    details.append(repeatedLayout(`Repeat n ${dag ? 'bindings' : 'entries'} · p starts at ${dag ? 40 : 24}`,
      [layoutField('p', 4, 'name length', 'size', 'u32 · m (1…128)'),
        layoutField('p + 4', 'm', 'name bytes', 'name', 'ASCII · no terminator'),
        layoutField('p + 4 + m', 16, dag ? 'node ID' : 'DAG ID', 'reference', 'raw ID', [dag ? 'node' : 'dag'])]),
      paragraph('Next entry: p ← p + 20 + m · names strictly sorted / unique', 'layout-caption'));
  }
  if (entity.id === 'commit') details.append(repeatedLayout('Repeat n parents · i = 0…n−1 · ordered, no duplicates',
    [layoutField('40 + 16i', 16, 'parent commit ID', 'reference', 'raw ID', ['commit'])]));
  if (entity.id === 'datum') {
    const label = document.createElement('label'); label.htmlFor = 'datum-kind'; label.textContent = 'Payload layout';
    const variants = document.createElement('select'); variants.id = 'datum-kind'; variants.className = 'variant-picker';
    datumKinds.forEach(([kind], index) => {
      const option = document.createElement('option'); option.value = String(index); option.textContent = `${index + 1} · ${kind}`; variants.append(option);
    });
    variants.value = '2';
    const payload = document.createElement('div');
    function showKind(index) {
      const fields = bodyLayouts.datum.map((field, position) => position === 0
        ? { ...field, value: `u32 · ${index + 1} = ${datumKinds[index][0]}` } : field);
      body.replaceChildren(memoryRows(fields));
      payload.replaceChildren(datumPayload(index));
    }
    showKind(2);
    variants.addEventListener('change', () => showKind(Number(variants.value)));
    details.append(label, variants, payload);
  }
  const source = document.createElement('a'); source.href = `spec-next/${entity.source}`; source.textContent = 'Layout & rules specification →'; details.append(source);
}
function select(id = '') {
  const entity = entities.find(item => item.id === id);
  const related = new Set(entity ? [id] : entities.map(item => item.id));
  document.querySelectorAll('#edges > g').forEach(edge => {
    const active = !entity || edge.dataset.from === id || edge.dataset.to === id;
    edge.classList.toggle('faded', !active);
    edge.querySelectorAll('path').forEach(path => path.classList.toggle('active', !!entity && active));
    if (active) { related.add(edge.dataset.from); related.add(edge.dataset.to); }
  });
  document.querySelectorAll('.entity').forEach(card => {
    card.classList.toggle('selected', !!entity && card.dataset.id === id);
    card.classList.toggle('faded', !related.has(card.dataset.id));
    card.setAttribute('aria-pressed', String(!!entity && card.dataset.id === id));
  });
  details.replaceChildren();
  details.scrollTop = 0;
  if (!entity) {
    details.append(heading('Overview', 'h2'), paragraph('Select an entity to inspect its packed byte layout and linked reference fields.'),
      paragraph('Drag to pan · scroll to zoom · focus the diagram and use + / − to zoom, 0 to fit · Escape returns to Overview', 'layout-caption'),
      heading('Physical layout'), paragraph('All seven key families coexist in LMDB’s main database. These cards are logical entity types, not SQL tables or named LMDB databases.'),
      heading('Content identity'), paragraph('The five immutable object types use 16-byte XXH3-128 content IDs. Keys use 32 lowercase hex characters; embedded references use raw 16-byte IDs.'),
      heading('Storage identity · record facet'), paragraph('Here storage identity means the implemented full-record/content ID, not a computational reuse identity. ◆ marks every body field hashed for Datum, Node, DAG, Tree and Commit. Refs and schema metadata have no content-addressed entity ID (—).'),
      heading('Hash domain'), list(identityEnvelope.map(item => `${item.hashed ? '◆ Included' : '○ Zeroed before hashing'}: ${item.label} (${item.width} bytes, byte ${item.offset})`)),
      paragraph('XXH3-128 hashes the entire validated packed byte sequence after zeroing magic, total-record-length and checksum bytes; those positions are zeroed, not omitted. The sequence length still matters. Record format version, record type, reserved flags and the complete body remain included. Names, embedded counts/lengths, ordering and raw 16-byte referenced IDs contribute. The LMDB key/path and the entity ID itself are not hash inputs.'),
      heading('Packed fields'), paragraph('Object records have a 20-byte envelope. Entries, bindings, and parent lists are embedded arrays; they have no separate keys or secondary indexes.'),
      heading('Validation & publication'), paragraph('The C storage layer checks direct references and their expected types and content IDs, not transitive graph integrity. Insert referenced children first. One write transaction can publish objects and a ref atomically.'),
      heading('Scope'), paragraph('Execution requests, attempts, and results use ordinary DAGs built from these object types, not additional native LMDB entities. Exchange/transfer packets are external transport files, not stored entity types. Tombstone recognition exists on reads, but no public tombstone writer or excision operation is implemented.', 'note'));
    return;
  }
  renderEntityLayout(entity);
}
let view = { x: 0, y: 0, width: 1200, height: 1160 };
function renderView() { svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.width} ${view.height}`); }
function zoom(factor, anchor = { x: view.x + view.width / 2, y: view.y + view.height / 2 }) {
  const width = Math.max(360, Math.min(3600, view.width * factor));
  const ratio = width / view.width;
  view = { x: anchor.x - (anchor.x - view.x) * ratio, y: anchor.y - (anchor.y - view.y) * ratio,
    width, height: view.height * ratio };
  renderView();
}
function point(event) {
  return new DOMPoint(event.clientX, event.clientY).matrixTransform(svg.getScreenCTM().inverse());
}
svg.addEventListener('wheel', event => {
  event.preventDefault(); zoom(Math.exp(Math.max(-200, Math.min(200, event.deltaY)) * .002), point(event));
}, { passive: false });
svg.addEventListener('keydown', event => {
  if (event.key === '+' || event.key === '=') { event.preventDefault(); zoom(.8); }
  else if (event.key === '-') { event.preventDefault(); zoom(1.25); }
  else if (event.key === '0') {
    event.preventDefault(); view = { x: 0, y: 0, width: 1200, height: 1160 }; renderView();
  }
});
let drag = null;
let suppressClick = false;
svg.addEventListener('pointerdown', event => {
  if (!event.isPrimary || event.button !== 0) return;
  suppressClick = false;
  drag = { id: event.pointerId, x: event.clientX, y: event.clientY, view: { ...view }, inverse: svg.getScreenCTM().inverse() };
});
svg.addEventListener('pointermove', event => {
  if (!drag || drag.id !== event.pointerId) return;
  if (!suppressClick && Math.hypot(event.clientX - drag.x, event.clientY - drag.y) < 5) return;
  suppressClick = true;
  svg.setPointerCapture(event.pointerId); svg.classList.add('dragging');
  const start = new DOMPoint(drag.x, drag.y).matrixTransform(drag.inverse);
  const current = new DOMPoint(event.clientX, event.clientY).matrixTransform(drag.inverse);
  view.x = drag.view.x + start.x - current.x; view.y = drag.view.y + start.y - current.y;
  renderView();
});
function stopDrag(event) {
  if (!drag || drag.id !== event.pointerId) return;
  drag = null; svg.classList.remove('dragging');
}
document.addEventListener('pointerup', stopDrag);
svg.addEventListener('pointercancel', stopDrag);
svg.addEventListener('lostpointercapture', stopDrag);
document.addEventListener('keydown', event => { if (event.key === 'Escape') select(); });
select();
</script>
